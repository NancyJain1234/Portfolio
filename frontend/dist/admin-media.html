<!DOCTYPE html>
<html>
<head>
  <title>Manage Media</title>
  <style>
    body{font-family:Arial;background:#020617;color:white;padding:30px}
    h1{color:#38bdf8}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:25px}
    .card{background:#0f172a;border:1px solid #334155;border-radius:18px;padding:20px}
    .card h3{margin-bottom:8px}
    .small{font-size:12px;color:#94a3b8;word-break:break-all}
    button{padding:10px 16px;border:none;border-radius:999px;cursor:pointer;margin-top:12px}
    .back{background:#38bdf8;color:white}
    .delete{background:#ef4444;color:white}
    .open{background:#22c55e;color:white}
    #status{color:#fbbf24;margin-top:15px}
  </style>
</head>
<body>

<button class="back" onclick="location.href='admin-dashboard.html'">&larr; Back</button>

<h1>Manage Portfolio Media</h1>
<p id="status">Loading media...</p>

<div id="mediaGrid" class="grid"></div>

<script>
if(sessionStorage.getItem("adminLoggedIn") !== "true"){
  window.location.href = "admin-login.html";
}

const API_URL = "https://4tuojd3urjilgxo4cvzz5alin40poezc.lambda-url.ap-south-1.on.aws/";

async function loadMedia(){
  const status = document.getElementById("status");
  const grid = document.getElementById("mediaGrid");

  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        action: "getMedia"
      })
    });

    const data = await response.json();

    if (!data.success) {
      status.innerText = data.message || data.error || "Failed to load media";
      return;
    }

    const items = data.items || [];
    grid.innerHTML = "";

    if(items.length === 0){
      status.innerText = "No media found.";
      return;
    }

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h3>${item.title}</h3>
        <p>${item.description || ""}</p>
        <p class="small"><b>Type:</b> ${item.type}</p>
        <p class="small"><b>File:</b> ${item.fileName}</p>
        <p class="small"><b>ID:</b> ${item.id}</p>
        <button class="open" onclick="window.open('${item.fileUrl}', '_blank')">Open File</button>
        <button class="delete" onclick="deleteMedia('${item.id}')">Delete</button>
      `;

      grid.appendChild(card);
    });

    status.innerText = `Loaded ${items.length} media items.`;

  }catch(error){
    status.innerText = "Error loading media: " + error.message;
  }
}

async function deleteMedia(id){
  const secret = sessionStorage.getItem("adminSecret");

  if(!confirm("Delete this media from S3 and PostgreSQL?")){
    return;
  }

  try{
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-secret": secret
      },
      body: JSON.stringify({
        action: "deleteMedia",
        id: id
      })
    });

    const result = await response.json();

    if(!result.success){
      alert(result.message || result.error || "Delete failed");
      return;
    }

    alert("Deleted successfully");
    loadMedia();

  }catch(error){
    alert("Error deleting media: " + error.message);
  }
}

loadMedia();
</script>

</body>
</html>
