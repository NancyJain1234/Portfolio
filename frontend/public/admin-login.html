<!DOCTYPE html>
<html>
<head>
  <title>Admin Login</title>
  <style>
    body{font-family:Arial;background:#020617;color:white;display:flex;align-items:center;justify-content:center;height:100vh}
    .box{background:#0f172a;padding:35px;border-radius:20px;width:350px}
    input,button{width:100%;padding:14px;margin-top:14px;border-radius:10px;border:none}
    button{background:#38bdf8;color:white;font-weight:bold;cursor:pointer}
  </style>
</head>
<body>
  <div class="box">
    <h2>Nancy Admin Login</h2>
    <input type="password" id="password" placeholder="Enter admin password">
    <button onclick="login()">Login</button>
  </div>

<script>
function login(){
  const password = document.getElementById("password").value.trim();

  if(!password){
    alert("Enter password");
    return;
  }

  sessionStorage.setItem("adminLoggedIn", "true");
  sessionStorage.setItem("adminSecret", password);

  window.location.href = "admin-dashboard.html";
}
</script>
</body>
</html>
